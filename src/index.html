<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
  </head>
  <body>
    <div id="container">
      <div id="sidebar">
        <div id="sidebar-header">
          <div id="sidebar-logo">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </div>
          <h1 id="sidebar-title">My tasks</h1>
        </div>
        <button id="add-task">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-plus preview-icon"
          >
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
          Add task
        </button>
        <div id="view-menu">
          <button id="view-inbox" class="nav-item active">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-inbox preview-icon"
            >
              <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
              <path
                d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"
              />
            </svg>
            Inbox
          </button>
          <button id="view-today" class="nav-item">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-calendar-days preview-icon"
            >
              <path d="M8 2v3" />
              <path d="M16 2v3" />
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M3 9h18" />
              <path d="M8 13h.01" />
              <path d="M12 13h.01" />
              <path d="M16 13h.01" />
              <path d="M8 17h.01" />
              <path d="M12 17h.01" />
              <path d="M16 17h.01" />
            </svg>
            Today
          </button>
          <button id="view-upcoming" class="nav-item">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-calendar-chevrons-right preview-icon"
            >
              <path d="m13 21 3-3-3-3" />
              <path d="M16 2v3" />
              <path d="m19 21 3-3-3-3" />
              <path d="M21 11.5V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h4" />
              <path d="M3 9h18" />
              <path d="M8 2v3" />
            </svg>
            Upcoming
          </button>
        </div>
        <div id="sidebar-projects">
          <h2>My Projects</h2>
          <button id="add-project">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-plus preview-icon"
            >
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
          </button>
        </div>
        <div id="project-list"></div>
      </div>
      <div id="main-panel">
        <div id="main-header">
          <div>
            <p id="breadcrumb">Personal</p>
            <h1 id="page-title">Inbox</h1>
            <div id="filter-pills"></div>
          </div>
          <p id="header-helper">Your tasks, all in one place</p>
        </div>
        <div id="main-divider"></div>
        <div id="task-list"></div>
      </div>
    </div>
    <dialog id="task-dialog">
      <form id="task-form">
        <h2 id="task-dialog-title">Add Task</h2>
        <div class="form-field">
          <label for="task-title-input">Title</label>
          <input
            id="task-title-input"
            name="title"
            type="text"
            placeholder="What needs to be done?"
            required
            pattern=".*\S.*"
            title="Enter a title"
          />
        </div>
        <div class="form-field">
          <label for="task-description-input">Description</label>
          <textarea
            id="task-description-input"
            name="description"
            placeholder="Add more details... (optional)"
          ></textarea>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="task-due-input">Due Date</label>
            <input id="task-due-input" name="dueDate" type="date" />
          </div>
          <div class="form-field">
            <label for="task-priority-input">Priority</label>
            <select id="task-priority-input" name="priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-field">
            <label for="task-project-button">Project</label>
            <div class="project-select">
              <button type="button" id="task-project-button" class="project-select-button">
                <span id="task-project-dot" class="project-dot"></span>
                <span id="task-project-label">Select Project</span>
              </button>
              <input type="hidden" id="task-project-input" name="projectId" />
              <div id="task-project-list" class="project-dropdown"></div>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button id="cancel-task" type="button">Cancel</button>
          <button id="submit-task" type="submit">Add Task</button>
        </div>
      </form>
    </dialog>
    <dialog id="project-dialog">
      <form id="project-form">
        <h2 id="project-dialog-title">Add Project</h2>
        <div class="form-field">
          <label for="project-name-input">Name</label>
          <input
            id="project-name-input"
            name="projectName"
            type="text"
            placeholder="e.g. Fitness"
            required
            pattern=".*\S.*"
            title="Enter a name"
          />
        </div>
        <div class="form-field">
          <label for="project-colour-input">Colour</label>
          <input id="project-colour-input" name="colour" type="color" value="#7c5cbf" />
        </div>
        <div class="form-actions">
          <button id="delete-project" type="button">Delete Project</button>
          <button id="cancel-project" type="button">Cancel</button>
          <button id="submit-project" type="submit">Add Project</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
